name: Receita desktop self-hosted probe
run-name: Receita self-hosted ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque test identifier
        required: true
      payload:
        description: Encrypted Receita request
        required: true

permissions:
  contents: read

concurrency:
  group: receita-self-hosted-desktop
  cancel-in-progress: false

jobs:
  issue:
    runs-on: [receita-desktop-probe]
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      RECEITA_EXECUTOR: local
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check existing desktop
        shell: bash
        run: |
          test -n "${DISPLAY:-}${WAYLAND_DISPLAY:-}"
          command -v uv google-chrome pdftotext
          google-chrome --version

      - name: Install locked project dependencies
        shell: bash
        run: uv sync --frozen --python 3.11

      - name: Issue and validate PDF in the existing desktop session
        shell: bash
        env:
          RECEITA_PAYLOAD: ${{ inputs.payload }}
          RECEITA_PAYLOAD_PRIVATE_KEY: ${{ secrets.RECEITA_PAYLOAD_PRIVATE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run --frozen python - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          from certidoes.github_payload import decrypt
          from certidoes.sources.receita import ReceitaRequest, generate

          out = Path("runs/self-hosted-probe")
          out.mkdir(parents=True, exist_ok=True)
          report = {"executor": "self-hosted desktop", "profile": "fresh"}
          started = time.monotonic()
          try:
              payload = decrypt(os.environ["RECEITA_PAYLOAD"], os.environ["RECEITA_PAYLOAD_PRIVATE_KEY"])
              for value in payload.values():
                  print(f"::add-mask::{value}", flush=True)
              result = generate(ReceitaRequest(**payload, output_dir=out,
                  profile_dir=Path("tmp/self-hosted-profile"), captcha_retries=1))
              pdf = result.pdf_path.read_bytes()
              assert pdf.startswith(b"%PDF-") and len(pdf) > 1000, "Invalid PDF"
              text = subprocess.check_output(["pdftotext", str(result.pdf_path), "-"], text=True)
              assert payload["documento"] in re.sub(r"\D", "", text), "Document mismatch"
              result.pdf_path.replace(out / "certificate.pdf")
              report.update(status="success", bytes=len(pdf), document_matches=True, metadata=result.metadata)
          except Exception as error:
              report.update(status="error", error_type=type(error).__name__,
                  stage=getattr(error, "stage", None), code=getattr(error, "code", None))
          report["elapsed_s"] = round(time.monotonic() - started, 2)
          (out / "result.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report), flush=True)
          raise SystemExit(0 if report["status"] == "success" else 1)
          PY

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: receita-self-hosted-${{ inputs.request_id }}
          path: runs/self-hosted-probe/result.json
          if-no-files-found: warn
          retention-days: 1
