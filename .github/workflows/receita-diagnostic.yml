name: Receita browser comparison
run-name: Receita browser comparison ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Compatibility with the existing dispatch"
        default: issue
      request_id:
        description: "Opaque validation identifier"
        default: ""
      payload:
        description: "Encrypted Receita request"
        default: ""

permissions:
  contents: read

concurrency:
  group: receita-browser-comparison-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: true

jobs:
  compare:
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, browser: standard}
          - {os: windows-2025, browser: cloak}
          - {os: ubuntu-24.04, browser: standard}
          - {os: ubuntu-24.04, browser: cloak}
          - {os: ubuntu-24.04, browser: cloak-native}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Install project and report parser
        shell: pwsh
        run: uv pip install --system --no-progress . pypdf==6.21.3

      - name: Install pinned free CloakBrowser wrapper
        if: startsWith(matrix.browser, 'cloak')
        shell: pwsh
        run: uv pip install --system --no-progress cloakbrowser==0.6.4

      - name: Ensure Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v xvfb-run; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi

      - name: Locate standard Chrome
        if: matrix.browser == 'standard'
        shell: pwsh
        run: |
          if ($IsWindows) {
            $chrome = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          } else {
            $chrome = (Get-Command google-chrome, google-chrome-stable -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          }
          if (-not $chrome) { throw "Google Chrome not found" }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $chrome --version

      - name: Run one bounded browser comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIVE_DOCUMENT: ${{ secrets.RECEITA_TEST_DOCUMENT }}
          LIVE_BIRTH: ${{ secrets.RECEITA_TEST_BIRTH }}
          RECEITA_PAYLOAD: ${{ inputs.payload }}
          RECEITA_PAYLOAD_PRIVATE_KEY: ${{ secrets.RECEITA_PAYLOAD_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ($IsWindows) {
            python experiments/receita_actions_probe/runner.py --browser '${{ matrix.browser }}'
          } else {
            xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" python experiments/receita_actions_probe/runner.py --browser '${{ matrix.browser }}'
          }
          exit $LASTEXITCODE

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-probe-${{ matrix.os }}-${{ matrix.browser }}-${{ inputs.request_id }}
          path: runs/actions-browser-probe/${{ matrix.browser }}/result.json
          if-no-files-found: warn
          retention-days: 1
