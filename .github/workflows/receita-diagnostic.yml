name: Receita SDK and timezone diagnosis
run-name: Receita SDK ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque diagnosis identifier
        required: true
      payload:
        description: Encrypted Receita request
        required: true

permissions:
  contents: read

jobs:
  diagnose:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: win64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Install fixed probe dependencies
        shell: pwsh
        run: uv pip install --system --no-progress . pypdf==6.21.3 playwright==1.64.1

      - name: Download the same Chrome build for this platform
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $archive = Join-Path $env:RUNNER_TEMP 'receita-chrome.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'receita-chrome'
          Invoke-WebRequest "https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.84/$platform/chrome-$platform.zip" -OutFile $archive
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            $chrome = Join-Path $destination 'chrome-win64/chrome.exe'
          } elseif ($IsMacOS) {
            /usr/bin/ditto -x -k $archive $destination
            $chrome = Join-Path $destination 'chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
            chmod +x $chrome
          } else {
            unzip -q $archive -d $destination
            $chrome = Join-Path $destination 'chrome-linux64/chrome'
            chmod +x $chrome
            chmod +x (Join-Path $destination 'chrome-linux64/chrome_crashpad_handler')
          }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $chrome --version

      - name: Diagnose the official form in each mode
        shell: pwsh
        env:
          RECEITA_PAYLOAD: ${{ inputs.payload }}
          RECEITA_PAYLOAD_PRIVATE_KEY: ${{ secrets.RECEITA_PAYLOAD_PRIVATE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          $failed = $false
          $cases = @(
            @{name='utc-double'; timezone='UTC'; single=$false},
            @{name='utc-single'; timezone='UTC'; single=$true},
            @{name='br-single'; timezone='E. South America Standard Time'; single=$true},
            @{name='br-double'; timezone='E. South America Standard Time'; single=$false}
          )
          foreach ($case in $cases) {
            Set-TimeZone -Id $case.timezone
            $arguments = @('-m', 'experiments.receita_environment_probe.probe', '--mode', 'headed', '--output', "runs/environment-probe/$($case.name)")
            if ($case.single) { $arguments += '--single-sdk' }
            & python @arguments
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
          exit 0

      - name: Upload redacted reports and masked screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: environment-${{ matrix.os }}-${{ inputs.request_id }}
          path: |
            runs/environment-probe/*/result.json
            runs/environment-probe/*/failure.png
          if-no-files-found: warn
          retention-days: 1
