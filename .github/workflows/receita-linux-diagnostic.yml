name: Receita Linux browser diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: src

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary -e . playwright

      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Validate hCaptcha through Linux Chrome
        env:
          LIVE_DOCUMENT: ${{ secrets.RECEITA_TEST_DOCUMENT }}
          LIVE_BIRTH: ${{ secrets.RECEITA_TEST_BIRTH }}
        run: |
          test -n "${LIVE_DOCUMENT//[[:space:]]/}" && test -n "${LIVE_BIRTH//[[:space:]]/}"
          export LIVE_DOCUMENT="$(printf %s "$LIVE_DOCUMENT" | tr -d '\r\n')"
          export LIVE_BIRTH="$(printf %s "$LIVE_BIRTH" | tr -d '\r\n')"
          mkdir -p runs/receita-github-linux tmp/receita-github-linux-profile
          xvfb-run -a --server-args='-screen 0 1920x1080x24 -nolisten tcp' \
            python experiments/receita_compare.py \
            --output runs/receita-github-linux/trace.json \
            --profile tmp/receita-github-linux-profile \
            --incognito --verify --transport browser

      - name: Upload redacted trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receita-linux-diagnostic-${{ github.run_id }}
          path: runs/receita-github-linux/trace.json
          if-no-files-found: warn
          retention-days: 7
