[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certidoes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "curl_cffi>=0.14", "opencv-python-headless>=4.10", "ddddocr>=1.6", "cryptography>=46", "fastapi>=0.115", "uvicorn>=0.30", "playwright>=1.55", "Pillow>=10", "mycdp==1.4.0", "websocket-client==1.9.2", "pypdf==6.21.3"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certidoes = ["*.pem"]
